{% extends "base.html" %}

{% block title %}Add Expense — Spendly{% endblock %}

{% block head %}
<style>
    .form-container {
        max-width: 500px;
        margin: 3rem auto;
        background: var(--bg-card, #fff);
        padding: 2.5rem;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        border: 1px solid var(--border-color, #eee);
    }

    .form-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .form-header h1 {
        font-size: 1.75rem;
        color: var(--text-main);
        margin-bottom: 0.5rem;
    }

    .form-header p {
        color: #666;
        font-size: 0.9rem;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: #555;
        margin-bottom: 0.5rem;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.2s;
        box-sizing: border-box;
    }

    .form-group input:focus {
        outline: none;
        border-color: var(--primary-color, #4a90e2);
        box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
    }

    .btn-submit {
        width: 100%;
        padding: 0.75rem;
        background: var(--primary-color, #4a90e2);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 1rem;
    }

    .btn-submit:hover {
        background: #357abd;
    }

    .btn-cancel {
        display: block;
        text-align: center;
        margin-top: 1rem;
        color: #666;
        text-decoration: none;
        font-size: 0.85rem;
    }

    .btn-cancel:hover {
        color: #333;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-header">
        <h1>Add New Expense</h1>
        <p>Keep track of your spending</p>
    </div>

    <form method="POST">
        <div class="form-group">
            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" name="amount" step="0.01" placeholder="0.00" required>
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" name="category" placeholder="e.g. Food, Travel, Bills" required>
        </div>

        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>
        </div>

        <div class="form-group">
            <label for="description">Description (Optional)</label>
            <textarea id="description" name="description" rows="3" placeholder="What was this for?"></textarea>
        </div>

        <button type="submit" class="btn-submit">Save Expense</button>
        <a href="{{ url_for('expenses') }}" class="btn-cancel">Cancel</a>
    </form>
</div>
{% endblock %}
